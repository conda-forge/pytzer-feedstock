{% set name = "pytzer" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytzer-{{ version }}.tar.gz
  sha256: d6ac57c1cdc02e100f7a07272f49d67b6cdd5aac1f5dd57d551356dbcbc8c8c0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - jax

test:
  imports:
    - pytzer
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: The Pitzer model for chemical activities and equilibria in aqueous solutions in Python
  license: GPL-3.0-only
  license_file: LICENSE
  home: https://pytzer.hseao3.group

extra:
  recipe-maintainers:
    - mvdh7
